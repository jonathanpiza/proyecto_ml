apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2                              # dos copias: si una falla, la otra responde
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: prediccion-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SALIDA
              value: /app/salida
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:                  # no recibe tráfico hasta que responda
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:                   # si deja de responder, Kubernetes la reinicia
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: salida
              mountPath: /app/salida
              readOnly: true
      volumes:
        - name: salida
          persistentVolumeClaim:
            claimName: salida-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
